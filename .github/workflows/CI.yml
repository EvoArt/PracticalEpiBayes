name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    permissions:
      actions: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # PracticalBayes and EpidemicTrajectories are not registered yet, so install them
      # from GitHub before the registered dependencies are resolved.
      - name: Install unregistered dependencies
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.develop([
              PackageSpec(url="https://github.com/EvoArt/PracticalBayes.jl"),
              PackageSpec(url="https://github.com/EvoArt/EpidemicTrajectories.git"),
          ])
          Pkg.instantiate()

      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
